<meta name="apple-mobile-web-app-title" content="Work It Out"/>
<meta name="theme-color" content="#0A0E13"/>
<style>
  :root, :root[data-theme="dark"]{
    --bg:#0A0E13; --bg2:#0D1219; --surface:#141B26; --surface2:#1B2432; --line:#26303F;
    --text:#EAF0F7; --muted:#8A96A8; --faint:#5B6675;
    --accent:#C7F94D; --accent-ink:#C7F94D; --accent-dim:#8FB537; --accent2:#FF6B35;
    --chest:#FF6B6B; --back:#4ECDC4; --legs:#A78BFA; --shoulders:#FFD166;
    --arms:#F97316; --core:#22D3EE; --cardio:#34D399; --olympic:#F472B6;
    --nav-bg:rgba(12,17,24,.92);
    --radius:16px; --nav-h:66px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#EEF1F5; --bg2:#E5E9EF; --surface:#FFFFFF; --surface2:#EDF1F6; --line:#D9E0E8;
    --text:#141A22; --muted:#5C6875; --faint:#95A1AE;
    --accent:#B7EF35; --accent-ink:#4D7C0F; --accent-dim:#5E8A12; --accent2:#E85A26;
    --nav-bg:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{min-height:100vh;}
  #root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);
    box-shadow:0 0 80px rgba(0,0,0,.5);}
  #loading{color:var(--accent-ink);text-align:center;padding-top:44vh;font-size:16px;letter-spacing:.08em;
    text-transform:uppercase;font-weight:700;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:0;height:0;}
  h1,h2,h3,h4,p{margin:0;}
  .app{padding:0 0 calc(var(--nav-h) + 18px);animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  /* ── Header ─────────────────────────────────────────── */
  .screen{padding:20px 18px 8px;}
  .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-dim);font-weight:800;}
  .title{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:3px;}
  .subtitle{color:var(--muted);font-size:14px;margin-top:4px;}
  .sectlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
    font-weight:800;margin:22px 0 10px;}

  /* ── Cards / generic ────────────────────────────────── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .row{display:flex;align-items:center;gap:12px;}
  .btn{background:var(--accent);color:#0A0E13;font-weight:800;border-radius:13px;padding:14px 18px;
    font-size:15px;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .08s ease, filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn.block{width:100%;}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .btn.warn{background:#2a1a1a;color:#ff9b8a;border:1px solid #43241f;}
  .btn.sm{padding:9px 13px;font-size:13px;border-radius:10px;}
  .chip{padding:8px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.15s;}
  .chip.on{background:var(--accent);color:#0A0E13;border-color:var(--accent);}
  .pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;
    border-radius:999px;background:var(--surface2);color:var(--muted);}
  .divider{height:1px;background:var(--line);margin:14px 0;}

  /* ── Stats grid ─────────────────────────────────────── */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px;}
  .stat{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 16px;}
  .stat .num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600;}
  .stat .unit{font-size:14px;color:var(--faint);font-weight:700;margin-left:3px;}

  /* ── Week chart ─────────────────────────────────────── */
  .weekbars{display:flex;justify-content:space-between;align-items:flex-end;gap:7px;height:80px;margin-top:6px;}
  .weekbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .weekbar .bar{width:100%;background:var(--surface2);border-radius:6px 6px 4px 4px;min-height:5px;transition:height .4s;}
  .weekbar .bar.has{background:linear-gradient(180deg,var(--accent),var(--accent-dim));}
  .weekbar .d{font-size:10px;color:var(--faint);font-weight:700;}

  /* ── History / list items ───────────────────────────── */
  .item{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:9px;}
  .item .dot{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:15px;color:#0A0E13;}
  .item .nm{font-weight:700;font-size:15px;}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .item .right{margin-left:auto;text-align:right;}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .empty{text-align:center;padding:34px 20px;color:var(--muted);}
  .empty .big{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;}

  /* ── Dex grid ───────────────────────────────────────── */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin:0 -2px;}
  .dexgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .dexcard{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;
    text-align:left;position:relative;overflow:hidden;transition:transform .08s;}
  .dexcard:active{transform:scale(.97);}
  .dexcard .glow{position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;
    filter:blur(26px);opacity:.5;}
  .dexcard .gname{font-weight:800;font-size:15.5px;letter-spacing:-.01em;position:relative;}
  .dexcard .gsub{font-size:12px;color:var(--muted);margin-top:3px;position:relative;}
  .dexcard .num{position:absolute;top:11px;right:13px;font-size:11px;font-weight:800;color:var(--faint);}
  .dots{display:flex;gap:3px;margin-top:11px;}
  .dots .d{width:15px;height:5px;border-radius:3px;background:var(--surface2);}

  /* ── Dex detail ─────────────────────────────────────── */
  .detail-hero{padding:22px 18px 18px;border-radius:0 0 24px 24px;position:relative;overflow:hidden;}
  .detail-hero .gtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.28);}
  .detail-hero h1{font-size:28px;font-weight:800;margin-top:12px;letter-spacing:-.02em;color:#0A0E13;}
  .steps{counter-reset:s;}
  .step{display:flex;gap:13px;margin-bottom:13px;}
  .step .n{counter-increment:s;flex-shrink:0;width:27px;height:27px;border-radius:9px;background:var(--surface2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
    color:var(--accent-ink);}
  .step .n::before{content:counter(s);}
  .step p{font-size:14.5px;line-height:1.5;color:var(--text);}
  .record{background:linear-gradient(150deg,#231a12,#1a130d);border:1px solid #3a2a1a;border-radius:15px;padding:16px;}
  .record .rl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FF8A4C;font-weight:800;}
  .record .rv{font-size:16px;font-weight:800;margin-top:7px;line-height:1.35;color:#F5EADD;}
  .record .rh{font-size:13px;color:#B9A88F;margin-top:5px;}
  .musclechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}

  /* ── Timer ──────────────────────────────────────────── */
  .timerface{text-align:center;padding:26px 0 14px;}
  .bigtime{font-size:66px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;}
  .phase{font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;margin-bottom:10px;}
  .tmode{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;}
  .tmode button{flex:1;padding:10px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--muted);}
  .tmode button.on{background:var(--accent);color:#0A0E13;}
  .cfgrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .cfgrow:last-child{border-bottom:none;}
  .stepper{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--line);border-radius:11px;}
  .stepper button{width:40px;height:40px;font-size:22px;font-weight:700;color:var(--accent-ink);}
  .stepper .v{min-width:52px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;}
  .stepper.sm button{width:34px;height:38px;font-size:19px;}
  .stepper.sm .v{min-width:40px;font-size:15px;}

  /* ── Forms ──────────────────────────────────────────── */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;}
  .field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:13px 14px;color:var(--text);font-size:15px;outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-dim);}
  .field textarea{resize:vertical;min-height:64px;}

  /* ── Nav ────────────────────────────────────────────── */
  .nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);z-index:40;max-width:520px;margin:0 auto;
    background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);min-width:0;}
  .navbtn.on{color:var(--accent-ink);}
  .navbtn span{font-size:9.5px;font-weight:700;letter-spacing:.01em;}

  /* ── Modal / session ────────────────────────────────── */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.78);backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
  .sheet{width:100%;max-width:520px;background:var(--bg2);border-radius:22px 22px 0 0;border:1px solid var(--line);
    border-bottom:none;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
    animation:up .28s cubic-bezier(.2,.9,.25,1);}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px;}
  .check{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;background:var(--surface);}
  .check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s;}
  .check.done .box{background:var(--accent);border-color:var(--accent);}
  .check.done .lbl{color:var(--faint);text-decoration:line-through;}
  .check .lbl{font-weight:600;font-size:14.5px;}

  /* ── Music ──────────────────────────────────────────── */
  .musichero{border-radius:20px;padding:22px;background:linear-gradient(135deg,#fb2c53,#ff5e3a);position:relative;overflow:hidden;}
  .musichero h2{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;}
  .musichero p{color:rgba(255,255,255,.9);font-size:13.5px;margin-top:6px;line-height:1.5;}
  .plgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px;}
  .plcard{border-radius:15px;padding:15px;text-align:left;min-height:104px;display:flex;flex-direction:column;
    justify-content:flex-end;position:relative;overflow:hidden;transition:transform .08s;}
  .plcard:active{transform:scale(.97);}
  .plcard h4{font-size:15px;font-weight:800;color:#fff;position:relative;}
  .plcard p{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:3px;position:relative;}
  .embedwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-top:12px;}
  .embedwrap iframe{width:100%;height:175px;border:none;display:block;}
  a.link{color:var(--accent);text-decoration:none;font-weight:700;}

  .toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);z-index:80;
    background:var(--accent);color:#0A0E13;font-weight:800;font-size:14px;padding:11px 20px;border-radius:999px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .2s;white-space:nowrap;}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="loading">Work It Out</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── STORAGE ────────────────────────────────────────────────────────────────
const NS = "wio.v1.";
function load(key, fallback){
  try{ const v = localStorage.getItem(NS+key); return v==null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){ try{ localStorage.setItem(NS+key, JSON.stringify(val)); }catch(e){} }
function usePersist(key, initial){
  const [v, setV] = useState(()=>load(key, initial));
  useEffect(()=>{ save(key, v); }, [key, v]);
  return [v, setV];
}

// ─── MUSCLE GROUPS ──────────────────────────────────────────────────────────
const GROUPS = {
  Chest:"var(--chest)", Back:"var(--back)", Legs:"var(--legs)", Shoulders:"var(--shoulders)",
  Arms:"var(--arms)", Core:"var(--core)", Cardio:"var(--cardio)", Olympic:"var(--olympic)"
};
const GROUP_ORDER = ["Chest","Back","Legs","Shoulders","Arms","Core","Cardio","Olympic"];
// difficulty 1–5 → human label ("how hard is it")
const DIFF_LABELS = ["Beginner","Novice","Intermediate","Advanced","Elite"];
const diffLabel = d => DIFF_LABELS[Math.max(1,Math.min(5,d))-1];

// ─── EXERCISE DATABASE (the MuscleDex) ──────────────────────────────────────
// difficulty 1–5. Records verified where an official record exists; where none is
// standardized, an honest elite benchmark is given.
const EXERCISES = [
  { id:"pushup", name:"Push-Up", group:"Chest", equip:"Bodyweight", diff:1,
    muscles:["Chest","Triceps","Front Deltoids","Core"],
    about:"The push-up is the original bodyweight pressing movement. It builds the chest, triceps and shoulders while forcing your core to hold a rigid plank. It scales endlessly — from knees to one-arm to explosive clap variations.",
    how:["Start in a high plank: hands slightly wider than shoulders, body in one straight line from head to heels.",
      "Brace your core and squeeze your glutes so your hips don't sag.",
      "Bend the elbows and lower until your chest is a fist's height from the floor. Keep elbows tracking at roughly 45°.",
      "Drive through your palms to press back up to full lockout.",
      "Breathe in on the way down, out on the way up."],
    record:{ v:"3,249 push-ups in one hour", h:"Daniel Scali (Australia), 2023 — Guinness World Record." } },

  { id:"bench", name:"Bench Press", group:"Chest", equip:"Barbell", diff:3,
    muscles:["Chest","Triceps","Front Deltoids"],
    about:"The barbell bench press is the benchmark of upper-body pressing strength and one of the three powerlifting lifts. Done well it develops the whole chest, front shoulders and triceps.",
    how:["Lie on the bench with eyes under the bar, feet flat and planted.",
      "Pull your shoulder blades down and together; keep a slight natural arch in your lower back.",
      "Grip a little wider than shoulder width and unrack to straight arms over your shoulders.",
      "Lower the bar under control to mid-chest, elbows tucked to about 45°.",
      "Press up and slightly back toward the rack until arms lock out. Always use a spotter or safety pins for heavy sets."],
    record:{ v:"335 kg / 738.5 lb raw bench press", h:"Kirill Sarychev (Russia), 2015 — heaviest raw (no bench shirt)." } },

  { id:"dbfly", name:"Dumbbell Fly", group:"Chest", equip:"Dumbbells", diff:2,
    muscles:["Chest","Front Deltoids"],
    about:"An isolation move that stretches and contracts the chest through a wide arc. Because leverage is brutal at the bottom, use lighter weight and focus on the squeeze, not the load.",
    how:["Lie on a flat bench holding a dumbbell in each hand, pressed above your chest, palms facing each other.",
      "Keep a soft, fixed bend in the elbows for the whole set.",
      "Open your arms out to the sides in a wide arc, feeling a deep stretch across the chest.",
      "Stop when your upper arms are roughly level with the bench.",
      "Squeeze the chest to bring the dumbbells back together over your chest."],
    record:{ v:"No standardized world record", h:"Elite benchmark: strong lifters fly cleanly with 40+ kg (90 lb) dumbbells per hand." } },

  { id:"pullup", name:"Pull-Up", group:"Back", equip:"Bodyweight / Bar", diff:3,
    muscles:["Lats","Biceps","Rear Deltoids","Forearms"],
    about:"The pull-up is the king of upper-body pulling. Hanging from a bar and lifting your entire bodyweight builds a wide back, strong biceps and a bulletproof grip.",
    how:["Grip the bar a little wider than shoulders, palms facing away. Hang at full stretch.",
      "Set your shoulders by pulling the blades down and back before you bend the arms.",
      "Drive your elbows down toward your ribs and pull until your chin clears the bar.",
      "Avoid kipping or swinging — keep the movement strict.",
      "Lower all the way down under control to a full dead hang, then repeat."],
    record:{ v:"~12,400 pull-ups in 24 hours", h:"Guinness category broken repeatedly; recent marks exceed 12,000 (e.g. X. Dillard, 2026)." } },

  { id:"deadlift", name:"Deadlift", group:"Back", equip:"Barbell", diff:4,
    muscles:["Glutes","Hamstrings","Lower Back","Lats","Traps","Core"],
    about:"Lifting a loaded bar from the floor to a standing lockout, the deadlift trains nearly every muscle on the back of your body. It is the ultimate test of raw, full-body strength.",
    how:["Stand with mid-foot under the bar, shins about an inch away.",
      "Hinge and grip just outside your knees. Drop your hips, chest up, back flat and neutral.",
      "Take the slack out of the bar, then push the floor away with your legs.",
      "Keep the bar dragging up close to your body; stand tall by driving your hips forward.",
      "Lock out with glutes squeezed, then reverse the path to set it down. Never round your lower back."],
    record:{ v:"510 kg / 1,124 lb deadlift", h:"Hafþór Björnsson (Iceland), World Deadlift Championships, Sept 2025." } },

  { id:"row", name:"Bent-Over Row", group:"Back", equip:"Barbell", diff:3,
    muscles:["Lats","Mid-Back","Rear Deltoids","Biceps"],
    about:"A horizontal pulling staple that thickens the mid-back and lats while training the hinge position under load. Great for building the postural muscles pressing movements neglect.",
    how:["Stand holding a barbell, hands just outside your knees.",
      "Hinge at the hips until your torso is roughly 45° or lower, back flat, knees soft.",
      "Let the bar hang at arms' length, then pull it toward your lower ribs / belly button.",
      "Squeeze your shoulder blades together at the top.",
      "Lower under control without letting your torso rise up. Keep the core braced throughout."],
    record:{ v:"No standardized world record", h:"Elite benchmark: strongmen perform heavy Pendlay-style rows well above 200 kg (440 lb)." } },

  { id:"latpull", name:"Lat Pulldown", group:"Back", equip:"Cable Machine", diff:2,
    muscles:["Lats","Biceps","Rear Deltoids"],
    about:"A machine-based vertical pull that mimics the pull-up while letting you dial the resistance. Ideal for building the lats before you can do full bodyweight pull-ups.",
    how:["Set the thigh pad and grab the bar wider than shoulder width, palms forward.",
      "Sit tall, chest up, with a slight lean back.",
      "Pull the bar down to your upper chest by driving your elbows down and back.",
      "Squeeze the lats at the bottom; don't shrug the shoulders up.",
      "Let the bar rise slowly to full stretch overhead, keeping tension. Don't use momentum."],
    record:{ v:"No standardized world record", h:"A machine accessory lift — progress is judged by controlled reps and full range, not a single record." } },

  { id:"squat", name:"Squat", group:"Legs", equip:"Bodyweight / Barbell", diff:2,
    muscles:["Quadriceps","Glutes","Hamstrings","Core"],
    about:"The squat is the foundation of lower-body strength. Whether bodyweight or loaded with a barbell, it trains the quads, glutes and core through a deep, athletic range of motion.",
    how:["Stand with feet shoulder-width, toes slightly turned out.",
      "Brace your core and keep your chest proud.",
      "Push your hips back and bend your knees to sit down between your legs.",
      "Descend until your thighs are at least parallel, knees tracking over your toes.",
      "Drive through your whole foot to stand back up tall, squeezing your glutes at the top."],
    record:{ v:"4,708 bodyweight squats in one hour", h:"Paddy Doyle (UK), 2007. Heaviest raw barbell squat: ~490 kg / 1,080 lb (Ray Williams)." } },

  { id:"lunge", name:"Lunge", group:"Legs", equip:"Bodyweight / Dumbbells", diff:2,
    muscles:["Quadriceps","Glutes","Hamstrings","Calves"],
    about:"A single-leg exercise that builds balance, fixes side-to-side strength imbalances and hammers the glutes and quads. Endlessly loadable and joint-friendly.",
    how:["Stand tall, feet hip-width. Add dumbbells at your sides for load.",
      "Step one foot forward into a long stride.",
      "Lower straight down until both knees are bent about 90°; the back knee hovers just off the floor.",
      "Keep your front knee over your ankle and torso upright.",
      "Push through the front heel to return to standing, then alternate legs."],
    record:{ v:"Farthest continuous lunging: several kilometres", h:"Charity lunge feats span multiple km; the walking lunge has no single strict-weight record." } },

// most recent logged result for an exercise, scanning newest-first history
function lastLogged(history, exId){
  for(const h of (history||[])){
    const it = (h.items||[]).find(x=>x.ex===exId && x.result);
    if(it) return { result:it.result, date:h.date };
  }
  return null;
}

  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const pad = n => String(n).padStart(2,"0");
  return h>0 ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}
function fmtDur(sec){
  const m = Math.round(sec/60);
  if(m<1) return `${Math.round(sec)}s`;
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)}h ${m%60}m`;
}
function relDate(ts){
  const d = new Date(ts), now = new Date();
  const dk = todayKey(ts);
  if(dk===todayKey(now)) return "Today";
  const y = new Date(now); y.setDate(y.getDate()-1);
  if(dk===todayKey(y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const DAY_MS = 864e5;
const startOfDay = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
// Streak = number of workout days in your current run. It only breaks once
// 5 full days pass with no workout, so you can miss up to 4 days and keep it.
function computeStreak(history){
  if(!history.length) return 0;
  const days = [...new Set(history.map(h=>startOfDay(h.date)))].sort((a,b)=>b-a); // most recent first
  const today0 = startOfDay(Date.now());
  if(today0 - days[0] >= 5*DAY_MS) return 0;   // 5+ days since last workout → streak lost
  let streak = 1;
  for(let i=1;i<days.length;i++){
    if(days[i-1] - days[i] < 5*DAY_MS) streak++; // gap under 5 days keeps the run going
    else break;
  }
  return streak;
}

// ─── AUDIO (interval beeps + finish sounds) ─────────────────────────────────
let _actx = null;
function ac(){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==="suspended") _actx.resume();
  }catch(e){}
  return _actx;
}
function beep(freq=880, dur=0.12, type="sine", vol=0.25){
  const ctx = ac(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
// schedule a single note at an offset (seconds) from now
function tone(freq, at, dur, type="sine", vol=0.28){
  const ctx = ac(); if(!ctx) return;
  try{
    const t0 = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
// a library of finish sounds you can choose between — all synthesized, no files
const SOUNDS = [
  { id:"chime",   name:"Chime",       play(){ tone(880,0,.5,"sine",.32); tone(1318.5,.13,.6,"sine",.3); } },
  { id:"bells",   name:"Bells",       play(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.12,.55,"sine",.3)); } },
  { id:"marimba", name:"Marimba",     play(){ [523.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,.4,"triangle",.34)); } },
  { id:"powerup", name:"Power Up",    play(){ [392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.075,.16,"square",.2)); } },
  { id:"triple",  name:"Triple Beep", play(){ [0,.2,.4].forEach(t=>tone(1046.5,t,.12,"square",.24)); } },
  { id:"digital", name:"Digital",     play(){ [1568,1568,2093].forEach((f,i)=>tone(f,i*.12,.1,"square",.2)); } },
  { id:"alarm",   name:"Alarm",       play(){ for(let i=0;i<4;i++){ tone(1200,i*.26,.13,"sawtooth",.22); tone(880,i*.26+.13,.13,"sawtooth",.22); } } },
  { id:"none",    name:"Silent",      play(){} },
];
const soundById = id => SOUNDS.find(s=>s.id===id) || SOUNDS[0];

// ═══ HOME ════════════════════════════════════════════════════════════════════
function HomeScreen({history, setHistory, setTab, startSession, workouts, settings, setSettings, notify, theme, setTheme, openLog}){
  const [remOpen, setRemOpen] = useState(false);
  const streak = useMemo(()=>computeStreak(history),[history]);
  const totalTime = useMemo(()=>history.reduce((a,h)=>a+(h.durationSec||0),0),[history]);

  // this week's calendar, always ordered Sunday → Saturday
  const week = useMemo(()=>{
    const now0 = new Date(); now0.setHours(0,0,0,0);
    const start = new Date(now0); start.setDate(now0.getDate()-now0.getDay()); // back up to Sunday
    const labels = ["S","M","T","W","T","F","S"];
    const arr = [];
    for(let i=0;i<7;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const k = todayKey(d);
      arr.push({ label:labels[i], count:history.filter(h=>todayKey(h.date)===k).length,
        isToday:k===todayKey(now0), future:d.getTime()>now0.getTime() });
    }
    return arr;
  },[history]);
  const maxC = Math.max(1, ...week.map(w=>w.count));
  const weekCount = week.reduce((a,w)=>a+w.count,0);

  const greeting = (()=>{ const h=new Date().getHours(); return h<12?"Good morning":h<18?"Good afternoon":"Good evening"; })();

  // rest-day / workout reminder banner
  const now = new Date();
  const workedOutToday = history.some(h=>todayKey(h.date)===todayKey(now));
  const isRestDay = (settings.restDays||[]).includes(now.getDay());
  const banner = workedOutToday
    ? { c:"var(--accent-ink)", icon:"check", t:"Logged today", d:"Nice work. Recovery starts now." }
    : isRestDay
    ? { c:"var(--core)",       icon:"bed",   t:"Rest day", d:"Recovery is where the gains happen — take it easy today." }
    : streak>=6
    ? { c:"var(--accent2)",    icon:"bed",   t:"Consider a rest day", d:`You've trained ${streak} days straight — a rest day aids recovery.`, action:true }
    : { c:"var(--accent-ink)", icon:"play",  t:"Time to move", d:"You haven't logged a workout today.", action:true };

  return (
    <div>
      <div className="screen">
        <div className="row" style={{justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div className="kicker">Work It Out</div>
            <div className="title">{greeting}</div>
          </div>
          <div className="row" style={{gap:8,marginTop:4}}>
            <button className="iconbtn" onClick={()=>setTheme(theme==="dark"?"light":"dark")} aria-label="Toggle light or dark mode">
              <Icon name={theme==="dark"?"sun":"moon"} size={17} color="var(--muted)"/>
            </button>
            <button className="iconbtn" onClick={()=>setRemOpen(true)} aria-label="Reminders">
              <Icon name="bell" size={17} color="var(--muted)"/>
            </button>
          </div>
        </div>
        <div className="subtitle">{history.length? "Let's keep the streak alive." : "Log your first workout to get started."}</div>

        <div className="card" style={{marginTop:16,borderLeft:`3px solid ${banner.c}`,display:"flex",alignItems:"center",gap:13}}>
          <div style={{width:38,height:38,borderRadius:11,background:"var(--surface2)",flexShrink:0,
            display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Icon name={banner.icon} size={19} color={banner.c}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:800,fontSize:15}}>{banner.t}</div>
            <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>{banner.d}</div>
          </div>
          {banner.action && <button className="btn sm" onClick={()=>setTab("workouts")}>Start</button>}
        </div>

        <div className="stats">
          <div className="stat">
            <div className="num">{streak}<span className="unit">{streak===1?"day":"days"}</span></div>
            <div className="lbl row" style={{gap:6}}><Icon name="flame" size={14} color="var(--accent2)"/> Current streak</div>
          </div>
          <div className="stat">
            <div className="num">{history.length}</div>
            <div className="lbl">Total workouts</div>
          </div>
          <div className="stat">
            <div className="num">{weekCount}</div>
            <div className="lbl">This week</div>
          </div>
          <div className="stat">
            <div className="num" style={{fontSize:totalTime>=3600?26:30}}>{totalTime>0?fmtDur(totalTime):"0"}</div>
            <div className="lbl">Total time</div>
          </div>
        </div>

        <div className="card" style={{marginTop:16}}>
          <div className="row" style={{justifyContent:"space-between"}}>
            <div style={{fontWeight:800,fontSize:15}}>This week</div>
            <div className="pill">{weekCount} {weekCount===1?"session":"sessions"}</div>
          </div>
          <div className="weekbars">
            {week.map((w,i)=>(
              <div className="weekbar" key={i}>
                <div className={"bar"+(w.count>0?" has":"")}
                  style={{height:(w.count/maxC*100)+"%", opacity:w.future?.4:1,
                    outline:w.isToday?"2px solid var(--accent)":"none", outlineOffset:"2px"}}/>
                <div className="d" style={w.isToday?{color:"var(--accent)",fontWeight:800}:null}>{w.label}</div>
              </div>
            ))}
          </div>
        </div>

        <button className="btn block" style={{marginTop:16}} onClick={()=>setTab("workouts")}>
          <Icon name="play" size={16} color="#0A0E13"/> Start a workout
        </button>

        <div className="sectlabel">Recent activity</div>
      </div>

      <div style={{padding:"0 18px"}}>
        {history.length===0 &&
          <div className="empty">
            <div className="big">No workouts yet</div>
            Pick a workout or explore the MuscleDex to begin. Everything you log shows up here.
          </div>}
        {history.slice(0,4).map(h=>(
          <HistoryItem key={h.id} h={h} onOpen={openLog} onDelete={()=>setHistory(list=>list.filter(x=>x.id!==h.id))}/>
        ))}
        {history.length>4 &&
          <button className="btn block ghost" style={{marginTop:4}} onClick={()=>setTab("logged")}>
            View all {history.length} logged
          </button>}
      </div>

      {remOpen && <RemindersSheet settings={settings} setSettings={setSettings} notify={notify} onClose={()=>setRemOpen(false)}/>}
    </div>
  );
}

// ═══ REMINDERS (rest days + daily nudge) ═════════════════════════════════════
function RemindersSheet({settings, setSettings, notify, onClose}){
  const s = settings;
  const dayShort = ["S","M","T","W","T","F","S"];
  const dayFull = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const rest = s.restDays||[];
  const toggleDay = (i)=>{
    if(rest.includes(i)){ setSettings(v=>({ ...v, restDays:(v.restDays||[]).filter(x=>x!==i) })); return; }
    if(rest.length>=5){ notify("You can set up to 5 rest days"); return; }
    setSettings(v=>({ ...v, restDays:[...(v.restDays||[]), i] }));
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <div className="row" style={{justifyContent:"space-between",marginBottom:6}}>

        </div>
        <p style={{color:"var(--muted)",fontSize:13.5,lineHeight:1.5,marginBottom:2}}>

                fontWeight:800,fontSize:14,border:"1px solid "+(on?"var(--core)":"var(--line)"),

      </div>
    </div>
  );
}

  const [running, setRunning] = useState(true);
  const [done, setDone] = useState({});
  const [results, setResults] = useState({});   // per-exercise "what you did"
  const [notes, setNotes] = useState("");

  const baseRef = useRef(0);

    startRef.current = Date.now();

    return ()=>{ baseRef.current = baseRef.current + (Date.now()-startRef.current)/1000; clearInterval(id); };
  },[running]);

  const items = w.items||[];
  const finish = ()=>{
    const loggedItems = items.map((it,i)=>({ ...it, result:(results[i]||"").trim() }));
    onFinish({ name:w.name, durationSec:Math.round(elapsed), items:loggedItems, notes:notes.trim(),

          <div className="row" style={{justifyContent:"center",gap:10,marginTop:14}}>
            <button className="btn ghost sm" onClick={()=>setRunning(r=>!r)}>{running?"Pause":"Resume"}</button>
            <button className="btn ghost sm" onClick={()=>{ baseRef.current=0; setElapsed(0); startRef.current=Date.now(); }}>Reset</button>

              </button>
              <input value={results[i]||""} onChange={e=>setResults(r=>({...r,[i]:e.target.value}))}
                placeholder={unit==="lb" ? "Sets / reps / weight — e.g. 135 lb × 10, 10, 8" : "Sets / reps / weight — e.g. 60 kg × 10, 10, 8"}
                style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--line)",borderRadius:10,

function Stopwatch(){
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const [laps, setLaps] = useState([]);
  const startRef = useRef(0), baseRef = useRef(0);

  useEffect(()=>{
    if(!running) return;
    startRef.current = Date.now();
    const id = setInterval(()=> setElapsed(baseRef.current + (Date.now()-startRef.current)/1000), 60);
    return ()=>{ baseRef.current += (Date.now()-startRef.current)/1000; clearInterval(id); };
  },[running]);

  const reset = ()=>{ setRunning(false); baseRef.current=0; setElapsed(0); setLaps([]); };
  const lap = ()=> setLaps(l=>[elapsed, ...l]);

  return (
    <div>
      <div className="card" style={{marginTop:16}}>
        <div className="timerface">
          <div className="bigtime">{fmtClock(elapsed)}</div>
        </div>
        <div className="row" style={{gap:10}}>
          <button className="btn block" onClick={()=>{ beep(660,.08); setRunning(r=>!r); }}>
            {running? "Pause" : "Start"}
          </button>
          {running
            ? <button className="btn ghost" style={{minWidth:96}} onClick={lap}>Lap</button>
            : <button className="btn ghost" style={{minWidth:96}} onClick={reset}>Reset</button>}
        </div>
      </div>
      {laps.length>0 &&
        <div style={{marginTop:14}}>
          {laps.map((l,i)=>(
            <div className="row" key={i} style={{justifyContent:"space-between",padding:"11px 4px",borderBottom:"1px solid var(--line)"}}>
              <span style={{color:"var(--muted)",fontWeight:700}}>Lap {laps.length-i}</span>
              <span style={{fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{fmtClock(l)}</span>
            </div>
          ))}
        </div>}
    </div>
  );
}

function IntervalTimer({finishSound, setFinishSound}){
  const [work, setWork] = usePersist("iv_work", 40);
  const [rest, setRest] = usePersist("iv_rest", 20);
  const [rounds, setRounds] = usePersist("iv_rounds", 8);

  const [active, setActive] = useState(false);
  const [phase, setPhase] = useState("work");   // work | rest | done
  const [round, setRound] = useState(1);
  const [left, setLeft] = useState(work);
  const tick = useRef(null);
  const soundRef = useRef(finishSound);          // latest chosen sound, read at completion
  useEffect(()=>{ soundRef.current = finishSound; }, [finishSound]);

  const startAll = ()=>{ beep(880,.1); setActive(true); setPhase("work"); setRound(1); setLeft(work); };
  const stopAll = ()=>{ setActive(false); setPhase("work"); setRound(1); setLeft(work); };
  // from the "Rest up next" hold, begin the rest countdown
  const startRest = ()=>{ beep(660,.08); setPhase("rest"); setLeft(rest); setActive(true); };

  useEffect(()=>{
    if(!active) return;
    tick.current = setInterval(()=>{
      setLeft(prev=>{
        if(prev>1) { if(prev<=4) beep(1200,.05,"square",.15); return prev-1; }
        // reached zero → transition
        if(phase==="work"){
          soundById(soundRef.current).play();            // finish sound at the end of every round
          if(round>=rounds){ setActive(false); setPhase("done"); return 0; }
          if(rest>0){ setActive(false); setPhase("restReady"); return 0; } // hold — tap to start rest
          setRound(r=>r+1); setPhase("work"); return work; // no rest set → straight to next round
        } else { // finishing a rest → next round's work
          beep(880,.18); setRound(r=>r+1); setPhase("work"); return work;
        }
      });
    },1000);
    return ()=>clearInterval(tick.current);
  },[active, phase, round, work, rest, rounds]);

  const phaseColor = phase==="work"?"var(--accent)":phase==="rest"?"var(--core)":"var(--accent2)";
  const total = phase==="rest"?rest:work;
  const pct = phase==="restReady"?0 : phase==="done"?100 : ((total-left)/total*100);

  if(active || phase==="done" || phase==="restReady"){
    const label = phase==="done"?"Complete":phase==="work"?"Work":phase==="rest"?"Rest":"Rest up next";
    return (
      <div className="card" style={{marginTop:16}}>
        <div className="timerface">
          <div className="phase" style={{color:phaseColor}}>{label}</div>
          <div className="bigtime" style={{color:phaseColor}}>
            {phase==="done"? <Icon name="check" size={58} color={phaseColor} stroke={2.5}/>
              : phase==="restReady"? fmtClock(rest) : fmtClock(left)}
          </div>
          <div style={{color:"var(--muted)",fontWeight:700,marginTop:10}}>
            {phase==="done"? `${rounds} rounds finished`
              : phase==="restReady"? `Round ${round} of ${rounds} done — rest is ${fmtClock(rest)}`
              : `Round ${round} of ${rounds}`}
          </div>
        </div>
        <div style={{height:6,background:"var(--surface2)",borderRadius:99,overflow:"hidden",margin:"4px 0 16px"}}>
          <div style={{height:"100%",width:pct+"%",background:phaseColor,transition:"width 1s linear"}}/>
        </div>
        {phase==="done"
          ? <button className="btn block" onClick={()=>{ setPhase("work"); setLeft(work); }}>Done</button>
          : phase==="restReady"
          ? <div className="row" style={{gap:10}}>
              <button className="btn block" onClick={startRest}><Icon name="play" size={15} color="#0A0E13"/> Start rest</button>
              <button className="btn ghost" style={{minWidth:92}} onClick={stopAll}>End</button>
            </div>
          : <button className="btn block warn" onClick={stopAll}>Stop</button>}
      </div>
    );
  }

  return (
    <div>
      <div className="card" style={{marginTop:16}}>
        <TimeStepper label="Work" seconds={work} setSeconds={setWork} minTotal={5}/>
        <TimeStepper label="Rest" seconds={rest} setSeconds={setRest} minTotal={0}/>
        <Stepper label="Rounds" unit="" value={rounds} setValue={setRounds} min={1} step={1}/>
      </div>
      <div className="card" style={{marginTop:12,textAlign:"center",color:"var(--muted)",fontSize:13.5}}>
        Total workout: <b style={{color:"var(--text)"}}>{fmtClock((work+rest)*rounds)}</b>
        <span style={{color:"var(--faint)"}}> · {rounds} rounds</span>
      </div>

      <SoundPicker value={finishSound} onChange={setFinishSound}/>

      <button className="btn block" style={{marginTop:16}} onClick={startAll}>
        <Icon name="play" size={16} color="#0A0E13"/> Start intervals
      </button>
    </div>
  );
}

// minutes + seconds stepper, stored/returned as total seconds
function TimeStepper({label, seconds, setSeconds, minTotal=0}){
  const m = Math.floor(seconds/60), s = seconds%60;
  const set = (nm, ns)=> setSeconds(Math.max(minTotal, nm*60 + ns));
  return (
    <div className="cfgrow">
      <div style={{fontWeight:700,fontSize:15}}>{label}</div>
      <div className="row" style={{gap:8}}>
        <div className="stepper sm">
          <button onClick={()=>set(Math.max(0, m-1), s)}>−</button>
          <div className="v">{m}<span style={{fontSize:11,color:"var(--muted)"}}> m</span></div>
          <button onClick={()=>set(Math.min(60, m+1), s)}>+</button>
        </div>
        <div className="stepper sm">
          <button onClick={()=>set(m, Math.max(0, s-5))}>−</button>
          <div className="v">{String(s).padStart(2,"0")}<span style={{fontSize:11,color:"var(--muted)"}}> s</span></div>
          <button onClick={()=>set(m, s>=55? 55 : s+5)}>+</button>
        </div>
      </div>
    </div>
  );
}

function Stepper({label, unit, value, setValue, min=0, step=1}){
  return (
    <div className="cfgrow">
      <div style={{fontWeight:700,fontSize:15}}>{label}</div>
      <div className="stepper">
        <button onClick={()=>setValue(v=>Math.max(min, v-step))}>−</button>
        <div className="v">{value}{unit && <span style={{fontSize:12,color:"var(--muted)"}}> {unit}</span>}</div>
        <button onClick={()=>setValue(v=>v+step)}>+</button>
      </div>
    </div>
  );
}

            <div style={{fontWeight:800,fontSize:22,marginTop:3}}>{h.name}</div>
            <div style={{fontSize:12.5,color:"var(--muted)",marginTop:3}}>{dateStr}</div>
          </div>
          <button className="iconbtn" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>

        <div className="row" style={{gap:10,marginTop:16}}>
          {h.durationSec>0 &&
            <div className="stat" style={{flex:1,padding:"13px 15px"}}>
              <div className="num" style={{fontSize:22}}>{fmtClock(h.durationSec)}</div>
              <div className="lbl">Duration</div>
            </div>}
          <div className="stat" style={{flex:1,padding:"13px 15px"}}>
            <div className="num" style={{fontSize:22}}>{items.length}</div>
            <div className="lbl">{items.length===1?"Exercise":"Exercises"}</div>
          </div>
        </div>

        {items.length>0 && <div className="sectlabel">Exercises</div>}
        {items.map((it,i)=>{
          const ex = exById(it.ex);
          const nm = ex? ex.name : (it.name||"Exercise");
          const col = ex? GROUPS[ex.group] : "var(--muted)";
          return (
            <div key={i} className="item" style={{alignItems:"flex-start"}}>
              <div style={{width:9,height:9,borderRadius:99,background:col,flexShrink:0,marginTop:6}}/>
              <div style={{flex:1,minWidth:0}}>
                <div className="nm" style={{fontSize:15}}>{nm}</div>
                {it.target && <div className="meta">Target · {it.target}</div>}
                {it.result
                  ? <div style={{fontSize:13.5,color:"var(--accent-ink)",fontWeight:700,marginTop:2}}>Logged · {it.result}</div>
                  : <div className="meta" style={{marginTop:2}}>Nothing logged for this one</div>}
              </div>
            </div>
          );
        })}

        <div className="sectlabel">How it went</div>
        <div className="card">
          {h.notes
            ? <div style={{fontSize:14.5,lineHeight:1.55,whiteSpace:"pre-wrap",color:"var(--text)"}}>{h.notes}</div>
            : <div style={{color:"var(--muted)",fontSize:14}}>You didn't add any notes for this workout.</div>}
        </div>

        <button className="btn block ghost" style={{marginTop:16}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

// ═══ LOGGED (full history) ══════════════════════════════════════════════════
function LoggedScreen({history, setHistory, setTab, openLog}){
  const total = history.length;
  const totalTime = history.reduce((a,h)=>a+(h.durationSec||0),0);
  const del = id=> setHistory(list=>list.filter(x=>x.id!==id));
  return (
    <div>
      <div className="screen">
        <div className="kicker">Logged</div>
        <div className="title">Your history</div>
        <div className="subtitle">Every workout you've logged, newest first.</div>
        {total>0 &&
          <div className="stats">
            <div className="stat"><div className="num">{total}</div><div className="lbl">Total workouts</div></div>
            <div className="stat"><div className="num" style={{fontSize:totalTime>=3600?26:30}}>{totalTime>0?fmtDur(totalTime):"0"}</div><div className="lbl">Total time</div></div>
          </div>}
      </div>
      <div style={{padding:"6px 18px 0"}}>
        {total===0 &&
          <div className="empty">
            <div className="big">Nothing logged yet</div>
            Start a workout and it'll show up here.
            <div><button className="btn sm" style={{marginTop:14}} onClick={()=>setTab("workouts")}>Go to Workouts</button></div>
          </div>}
        {history.map(h=><HistoryItem key={h.id} h={h} onOpen={openLog} onDelete={()=>del(h.id)}/>)}
      </div>
    </div>
  );
}

// ═══ GOALS ═══════════════════════════════════════════════════════════════════
function GoalsScreen({goals, setGoals}){
  const [title, setTitle] = useState("");
  const [detail, setDetail] = useState("");
  const add = ()=>{
    const t = title.trim(); if(!t) return;
    setGoals(g=>[{ id:uid(), title:t, detail:detail.trim(), done:false, created:Date.now() }, ...g]);
    setTitle(""); setDetail("");
  };
  const toggle = id=> setGoals(g=>g.map(x=>x.id===id?{...x,done:!x.done}:x));
  const del = id=> setGoals(g=>g.filter(x=>x.id!==id));
  const active = goals.filter(g=>!g.done);
  const done = goals.filter(g=>g.done);
  return (
    <div>
      <div className="screen">
        <div className="kicker">Goals</div>
        <div className="title">What you're working toward</div>
        <div className="subtitle">Set targets and check them off as you hit them.</div>

        <div className="card" style={{marginTop:16}}>
          <div className="field" style={{marginBottom:10}}>
            <label>New goal</label>
            <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Bench press 100 kg"
              onKeyDown={e=>{ if(e.key==="Enter") add(); }}/>
          </div>
          <div className="field" style={{marginBottom:12}}>
            <label>Detail (optional)</label>
            <input value={detail} onChange={e=>setDetail(e.target.value)} placeholder="e.g. by the end of the year"
              onKeyDown={e=>{ if(e.key==="Enter") add(); }}/>
          </div>
          <button className="btn block" onClick={add}><Icon name="plus" size={16} color="#0A0E13"/> Add goal</button>
        </div>
      </div>

      <div style={{padding:"6px 18px 0"}}>
        {goals.length===0 &&
          <div className="empty"><div className="big">No goals yet</div>Add your first goal above — big or small.</div>}

        {active.length>0 && <div className="sectlabel" style={{marginTop:4}}>Active ({active.length})</div>}
        {active.map(g=><GoalCard key={g.id} g={g} onToggle={()=>toggle(g.id)} onDelete={()=>del(g.id)}/>)}

        {done.length>0 && <div className="sectlabel">Achieved ({done.length})</div>}
        {done.map(g=><GoalCard key={g.id} g={g} onToggle={()=>toggle(g.id)} onDelete={()=>del(g.id)}/>)}
      </div>
    </div>
  );
}

function GoalCard({g, onToggle, onDelete}){
  return (
    <div className="item" style={{opacity:g.done?.72:1}}>
      <button onClick={onToggle} aria-label="Toggle goal" style={{background:"none",border:"none",padding:0,flexShrink:0}}>
        <div style={{width:26,height:26,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",
          border:"2px solid "+(g.done?"var(--accent)":"var(--faint)"), background:g.done?"var(--accent)":"transparent"}}>
          {g.done && <Icon name="check" size={15} color="#0A0E13"/>}
        </div>
      </button>
      <div style={{minWidth:0,flex:1}}>
        <div className="nm" style={{textDecoration:g.done?"line-through":"none"}}>{g.title}</div>
        {g.detail && <div className="meta">{g.detail}</div>}
      </div>
      <button className="iconbtn" onClick={onDelete} aria-label="Delete goal"><Icon name="trash" size={15} color="var(--faint)"/></button>
    </div>
  );
}

// small kg / lb segmented switch
function UnitToggle({unit, setUnit}){
  return (
    <div style={{display:"inline-flex",background:"var(--surface2)",border:"1px solid var(--line)",borderRadius:10,padding:3,gap:3}}>
      {["kg","lb"].map(u=>(
        <button key={u} onClick={()=>setUnit(u)} style={{padding:"6px 15px",borderRadius:8,fontWeight:800,fontSize:13,
          background:unit===u?"var(--accent)":"transparent", color:unit===u?"#0A0E13":"var(--muted)"}}>{u}</button>
      ))}
    </div>
  );
}

// ═══ GEAR SHEET (what gear & weight a workout needs) ═════════════════════════
function GearSheet({workout, history, unit, setUnit, onClose}){
  const items = workout.items||[];
  const gearList = [];
  items.forEach(it=>{ (gearFor(it.ex).gear||[]).forEach(g=>{ if(!gearList.includes(g)) gearList.push(g); }); });
  const [checked, setChecked] = useState({});
  return (
    <div className="overlay" onClick={onClose} style={{alignItems:"stretch"}}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:"92vh"}}>
        <div className="grab"/>
        <div className="row" style={{justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{minWidth:0}}>
            <div className="kicker">Gear needed</div>
            <div style={{fontWeight:800,fontSize:22,marginTop:3}}>{workout.name}</div>
          </div>
          <button className="iconbtn" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>

        {gearList.length>0 && <div className="sectlabel">Grab this gear</div>}
        {gearList.map((g,i)=>{
          const on = checked[i];
          return (
            <button key={i} className={"check"+(on?" done":"")} style={{width:"100%"}} onClick={()=>setChecked(c=>({...c,[i]:!c[i]}))}>
              <div className="box">{on && <Icon name="check" size={15} color="#0A0E13"/>}</div>
              <div className="lbl">{g}</div>
            </button>
          );
        })}

        {items.length>0 &&
          <div className="row" style={{justifyContent:"space-between",alignItems:"center",margin:"22px 0 10px"}}>
            <div className="sectlabel" style={{margin:0}}>What weight per exercise</div>
            <UnitToggle unit={unit} setUnit={setUnit}/>
          </div>}
        {items.map((it,i)=>{
          const ex = exById(it.ex);
          const nm = ex? ex.name : (it.name||"Exercise");
          const col = ex? GROUPS[ex.group] : "var(--muted)";
          const info = gearFor(it.ex);
          const last = lastLogged(history, it.ex);
          return (
            <div key={i} className="item" style={{alignItems:"flex-start"}}>
              <div style={{width:9,height:9,borderRadius:99,background:col,flexShrink:0,marginTop:6}}/>
              <div style={{flex:1,minWidth:0}}>
                <div className="nm" style={{fontSize:15}}>{nm}
                  <span style={{color:"var(--muted)",fontWeight:600,fontSize:12.5}}>{ex?"  ·  "+ex.equip:""}</span></div>
                <div className="meta" style={{marginTop:3,lineHeight:1.45}}>{info.weight(unit)}</div>
                {last && <div style={{fontSize:13,color:"var(--accent-ink)",fontWeight:700,marginTop:4}}>You last did · {last.result}</div>}
              </div>
            </div>
          );
        })}

        <button className="btn block ghost" style={{marginTop:16}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

// ─── MOUNT ───────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
